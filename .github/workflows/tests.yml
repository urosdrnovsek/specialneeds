name: Tests
# Runs the whole suite on every push and pull request so browser tests cannot silently go stale again
# (before Nov 2026, 19 of 24 Playwright suites failed unnoticed).
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npx prettier --check "dist/*.js" "dist/*.css" "tests/*.cjs" "scripts/*.cjs" "scripts/*.mjs"
      - run: npm test
        env:
          CHROMIUM_PATH: ''
      - run: npm run test:studio && npm run test:device && npm run test:reading
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-screenshots
          path: test-results/
          if-no-files-found: ignore
